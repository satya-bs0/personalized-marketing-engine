[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "donor-messaging-poc"
version = "0.1.0"
description = "Personalized donor messaging POC for Takeda plasma donation campaigns"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "faker>=24.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
    "tenacity>=8.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]
ai = []
eval = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "textstat>=0.7.3",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]
dashboard = [
    "streamlit>=1.33.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: live integration test requiring real API credentials — skip by default",
]
